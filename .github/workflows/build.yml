name: Profile README - Header

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - today.py
      - header.svg
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: profile-readme-header
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cache/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Generate header SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.METRICS_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: python today.py

      - name: Commit
        run: |-
          git add .
          git diff
          git config --global user.email "github-actions-bot@thiago-diegoli.github.io"
          git config --global user.name "thiago-diegoli/GitHub-Actions-Bot"
          git commit -m "Updated README" -a || echo "No changes to commit"
          git push || { git pull --rebase && git push; }
